name: Promote tested temp build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-tested-temp-build.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repo
        uses: actions/checkout@v4
        with:
          path: prod
          ref: main
          fetch-depth: 2

      - name: Checkout tested temp repo
        uses: actions/checkout@v4
        with:
          repository: JackDav91/temporary-test-repo
          ref: main
          path: tested
          fetch-depth: 1

      - name: Copy tested baseline
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            manifest.json
            sw.js
            gengrail-theme.css
            home-compact.css
            gengrail-ebay.js
            gengrail-profit-engine.js
            profit-engine-diagnostic.js
            graded-integration.js
            graded-market-engine.js
            graded-stock-ui.js
            grail-hub.css
            grail-hub.js
            ebay-callback.html
            ebay-declined.html
            privacy.html
            icon-192.png
            icon-512.png
            GENGRAIL_MASTER_PLAN.md
            PROFIT_ENGINE_TEST_PLAN.md
            README.txt
          )
          for f in "${files[@]}"; do
            test -f "tested/$f" || { echo "Missing tested baseline file: $f"; exit 1; }
            cp "tested/$f" "prod/$f"
          done

      - name: Baseline safety gates
        shell: bash
        run: |
          set -euo pipefail
          cd prod
          for f in index.html manifest.json sw.js gengrail-theme.css home-compact.css gengrail-ebay.js gengrail-profit-engine.js profit-engine-diagnostic.js graded-integration.js graded-market-engine.js graded-stock-ui.js grail-hub.css grail-hub.js; do
            test -s "$f"
            cmp "$f" "../tested/$f"
          done
          grep -q 'recognise-card' index.html
          grep -q 'GengrailProfitEngine' gengrail-profit-engine.js
          grep -q 'recognise-slab' graded-integration.js
          grep -q 'home-compact.css' index.html
          grep -q 'grail-hub.css' index.html
          grep -q 'grail-hub.js' index.html
          grep -q 'home-compact.css' sw.js
          grep -q 'grail-hub.css' sw.js
          grep -q 'grail-hub.js' sw.js
          ! grep -R -n 'temporary-test-repo' index.html gengrail-ebay.js graded-integration.js profit-engine-diagnostic.js home-compact.css grail-hub.js grail-hub.css

      - name: Commit current tested application baseline
        shell: bash
        run: |
          set -euo pipefail
          cd prod
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js gengrail-theme.css home-compact.css gengrail-ebay.js gengrail-profit-engine.js profit-engine-diagnostic.js graded-integration.js graded-market-engine.js graded-stock-ui.js grail-hub.css grail-hub.js ebay-callback.html ebay-declined.html privacy.html icon-192.png icon-512.png GENGRAIL_MASTER_PLAN.md PROFIT_ENGINE_TEST_PLAN.md README.txt
          if git diff --cached --quiet; then
            echo 'Production already matches the current tested baseline.'
            exit 0
          fi
          git commit -m 'Set current tested Gengrail build as production baseline'
          git push origin HEAD:main
