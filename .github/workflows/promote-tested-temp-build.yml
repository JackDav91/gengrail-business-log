name: Promote tested Gengrail build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-tested-temp-build.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROMOTE to deploy the tested build'
        required: true
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gengrail-production-pages
  cancel-in-progress: false

jobs:
  promote-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate manual promotion
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test "${{ inputs.confirm }}" = "PROMOTE" || { echo 'Promotion cancelled: confirmation must be PROMOTE'; exit 1; }

      - name: Checkout production repo
        uses: actions/checkout@v4
        with:
          path: prod
          ref: main
          fetch-depth: 2

      - name: Checkout tested temp repo
        uses: actions/checkout@v4
        with:
          repository: JackDav91/temporary-test-repo
          ref: main
          path: tested
          fetch-depth: 1

      - name: Copy tested application baseline
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            manifest.json
            sw.js
            gengrail-theme.css
            home-compact.css
            gengrail-ebay.js
            gengrail-profit-engine.js
            profit-engine-diagnostic.js
            graded-integration.js
            graded-market-engine.js
            graded-stock-ui.js
            grail-hub.css
            grail-hub.js
            grail-selectable-stream-v1.js
            grail-pre2002-safety.js
            grail-visual-gate.js
            ebay-callback.html
            ebay-declined.html
            privacy.html
            icon-192.png
            icon-512.png
            GENGRAIL_MASTER_PLAN.md
            PROFIT_ENGINE_TEST_PLAN.md
            README.txt
          )
          for f in "${files[@]}"; do
            test -f "tested/$f" || { echo "Missing tested baseline file: $f"; exit 1; }
            cp "tested/$f" "prod/$f"
          done
          test -s prod/gengrail-consistency-patch.js
          test -s prod/gengrail-catalogue-live-pricing.js

      - name: Convert tested build to production
        shell: bash
        run: |
          set -euo pipefail
          cd prod
          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in [
              'index.html','sw.js','gengrail-ebay.js','profit-engine-diagnostic.js',
              'graded-integration.js','home-compact.css','grail-hub.js','grail-hub.css',
              'grail-selectable-stream-v1.js','grail-pre2002-safety.js','grail-visual-gate.js'
          ]:
              p=Path(name)
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  s=s.replace('/temporary-test-repo/','/gengrail-business-log/')
                  s=s.replace('temporary-test-repo','gengrail-business-log')
                  p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          tags=(
              '<script src="gengrail-consistency-patch.js?v=launch-20260818"></script>'
              '<script src="gengrail-catalogue-live-pricing.js?v=launch-20260818"></script>'
          )
          html=re.sub(r'<script[^>]+gengrail-consistency-patch\.js[^>]*></script>','',html,flags=re.I)
          html=re.sub(r'<script[^>]+gengrail-catalogue-live-pricing\.js[^>]*></script>','',html,flags=re.I)
          html=html.replace('</body>',tags+'</body>') if '</body>' in html else html+tags
          p.write_text(html,encoding='utf-8')

          p=Path('sw.js')
          sw=p.read_text(encoding='utf-8')
          sw=re.sub(r"const C='[^']+'", "const C='gengrail-live-v25.0.0-business-launch'", sw, count=1)
          if "'./gengrail-consistency-patch.js'" not in sw:
              sw=sw.replace("'./grail-selectable-stream-v1.js'", "'./grail-selectable-stream-v1.js','./gengrail-consistency-patch.js','./gengrail-catalogue-live-pricing.js'")

          old="function showDeal(x){const fee=.135,pack=.30,landed=x.ask+x.ship,req15=(landed+pack)/(1-fee-.15),req20=(landed+pack)/(1-fee-.20),fee15=req15*fee,market=x.market||0,gap15=market-req15;"
          new="function showDeal(x){const pol=window.GengrailListingPolicy,st=pol&&pol.stage?pol.stage():{key:'SEED',minimumMargin:.10,preferredMargin:.15},seller=pol&&pol.sellerMode?pol.sellerMode():'PRIVATE_UK',fee=seller==='PRIVATE_UK'?0:.135,pack=.30,landed=x.ask+x.ship,minM=Number(st.minimumMargin||.10),prefM=Number(st.preferredMargin||.15),req15=(landed+pack)/(1-fee-minM),req20=(landed+pack)/(1-fee-prefM),fee15=req15*fee,market=x.market||0,gap15=market-req15;"
          if old in sw:
              sw=sw.replace(old,new)
          sw=sw.replace('EST. SELLING FEES @ 15%','EST. SELLING FEES')
          sw=sw.replace('15% MARGIN RESALE','PROTECTED MARGIN RESALE')
          sw=sw.replace('20% MARGIN RESALE','PREFERRED MARGIN RESALE')
          sw=sw.replace('above the 15% target resale.','above the protected target resale.')
          sw=sw.replace('15% target resale is ','Protected target resale is ')
          p.write_text(sw,encoding='utf-8')
          PY

      - name: Production launch safety gates
        shell: bash
        run: |
          set -euo pipefail
          cd prod
          required=(
            index.html manifest.json sw.js gengrail-theme.css home-compact.css
            gengrail-ebay.js gengrail-profit-engine.js profit-engine-diagnostic.js
            gengrail-consistency-patch.js gengrail-catalogue-live-pricing.js
            graded-integration.js graded-market-engine.js graded-stock-ui.js
            grail-hub.css grail-hub.js grail-selectable-stream-v1.js
            grail-pre2002-safety.js grail-visual-gate.js
          )
          for f in "${required[@]}"; do test -s "$f" || { echo "Missing/empty production file: $f"; exit 1; }; done
          grep -q 'recognise-card' index.html
          grep -q 'GengrailProfitEngine' gengrail-profit-engine.js
          grep -q 'recognise-slab' graded-integration.js
          grep -q 'GengrailListingPolicy' gengrail-consistency-patch.js
          grep -q 'GengrailCatalogueLivePricing' gengrail-catalogue-live-pricing.js
          grep -q 'grail-selectable-stream-v1.js' sw.js
          grep -q 'gengrail-live-v25.0.0-business-launch' sw.js
          grep -q 'gengrail-consistency-patch.js?v=launch-20260818' index.html
          grep -q 'gengrail-catalogue-live-pricing.js?v=launch-20260818' index.html
          ! grep -R -n 'temporary-test-repo' index.html sw.js gengrail-ebay.js graded-integration.js profit-engine-diagnostic.js home-compact.css grail-hub.js grail-hub.css grail-selectable-stream-v1.js grail-pre2002-safety.js grail-visual-gate.js

      - name: Commit live production build
        shell: bash
        run: |
          set -euo pipefail
          cd prod
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Promote tested Gengrail build for business launch'
            git push origin HEAD:main
          else
            echo 'Production source already matches the tested launch build.'
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prod

      - name: Deploy live Gengrail site
        id: deployment
        uses: actions/deploy-pages@v4

