<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Gengrail Reset</title><style>body{margin:0;background:#080808;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.b{padding:28px;max-width:480px}.g{color:#82dda0;font-weight:900}</style></head><body><div class="b"><h1>GENGRAIL</h1><p>Clearing the previous production cache.</p><p class="g" id="s">RESETTING…</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}document.getElementById('s').textContent='READY · LOADING APP…';setTimeout(()=>location.replace('./?recovery=working-test'),500)}catch(e){location.replace('./?recovery=working-test')}})();</script></body></html>
