<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Gengrail Launch Reset</title><style>body{margin:0;background:#080808;color:#f4f1ea;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:520px;width:100%;background:#101410;border:1px solid #765814;border-radius:18px;padding:24px;box-shadow:0 18px 50px #000}.c{font-size:42px}.t{font-weight:950;font-size:28px;margin-top:10px}.s{color:#aaa;line-height:1.5;margin-top:10px}.ok{color:#82dda0;font-weight:900;margin-top:18px}</style></head><body><div class="box"><div class="c">♛</div><div class="t">GENGRAIL PRODUCTION LAUNCH</div><div class="s">Clearing the previous app cache and service worker so Safari loads the new business launch build cleanly.</div><div class="ok" id="status">RESETTING…</div></div><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}s.textContent='RESET COMPLETE · LOADING GENGRAIL…';setTimeout(()=>location.replace('./?launch=20260818-25'),700)}catch(e){s.textContent='RESET COMPLETE · LOADING…';setTimeout(()=>location.replace('./?launch=20260818-25'),700)}})();</script></body></html>
